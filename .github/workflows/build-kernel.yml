name: Build Kernel (Droidspaces)

on:
  push:
    branches: [ droidspaces-support ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        ref: droidspaces-support
        fetch-depth: 1

    - name: Build kernel (GCC 4.9 from git)
      timeout-minutes: 110
      shell: bash
      run: |
        set -eo pipefail
        echo "=== Installing dependencies ==="
        sudo apt-get update -q
        sudo apt-get install -y bc bison flex libssl-dev make git ccache python3 xz-utils wget

        echo "=== Cloning AOSP GCC 4.9 toolchain ==="
        # Use AOSP prebuilts mirror on GitHub
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git toolchain || {
          echo "FAILED to clone from LineageOS, trying alternative..."
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 toolchain
        }

        TOOLCHAIN_DIR="$(pwd)/toolchain/bin"
        export CROSS_COMPILE="${TOOLCHAIN_DIR}/aarch64-linux-android-"
        export ARCH=arm64

        echo "=== Verify toolchain ==="
        ls -la "${TOOLCHAIN_DIR}/aarch64-linux-android-"* || { echo "ERROR: toolchain binaries not found!"; exit 1; }
        ${CROSS_COMPILE}gcc --version | head -1

        echo "=== Generate defconfig ==="
        make O=out ARCH=arm64 CROSS_COMPILE=${CROSS_COMPILE} lineage-msm8998-yoshino-lilac_defconfig

        echo "=== Build kernel (verbose) ==="
        make O=out ARCH=arm64 CROSS_COMPILE=${CROSS_COMPILE} -j$(nproc) 2>&1 | tee build.log

        echo "=== Verify output ==="
        ls -lh out/arch/arm64/boot/Image.gz-dtb
        echo "BUILD_SUCCESS=true" >> $GITHUB_OUTPUT

    - name: Upload kernel artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Image.gz-dtb-droidspaces
        path: out/arch/arm64/boot/Image.gz-dtb
        retention-days: 30
        if-no-files-found: warn

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
        retention-days: 7
