name: Build Kernel (Droidspaces)

on:
  push:
    branches: [ droidspaces-support ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        ref: droidspaces-support
        fetch-depth: 1

    - name: Build kernel with AOSP GCC 4.9
      timeout-minutes: 110
      run: |
        set -e
        echo "=== Installing dependencies ==="
        sudo apt-get update -q
        sudo apt-get install -y bc bison flex libssl-dev make git ccache python3 xz-utils

        echo "=== Cloning AOSP GCC 4.9 toolchain ==="
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git toolchain
        export CROSS_COMPILE=$(pwd)/toolchain/bin/aarch64-linux-android-
        export ARCH=arm64

        echo "=== Toolchain version ==="
        ${CROSS_COMPILE}gcc --version | head -1

        echo "=== Generating defconfig ==="
        make O=out ${ARCH:+"ARCH=$ARCH"} CROSS_COMPILE=${CROSS_COMPILE} lineage-msm8998-yoshino-lilac_defconfig

        echo "=== Building kernel ==="
        make O=out ${ARCH:+"ARCH=$ARCH"} CROSS_COMPILE=${CROSS_COMPILE} -j$(nproc) 2>&1 | tee build.log

        echo "=== Verifying output ==="
        ls -lh out/arch/arm64/boot/Image.gz-dtb
        echo "BUILD_SUCCESS=true" >> $GITHUB_OUTPUT

      shell: bash

    - name: Upload kernel artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Image.gz-dtb-droidspaces
        path: out/arch/arm64/boot/Image.gz-dtb
        retention-days: 30
        if-no-files-found: warn

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
        retention-days: 7
