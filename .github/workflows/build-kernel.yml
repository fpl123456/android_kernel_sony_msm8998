name: Build Lilac Kernel (Droidspaces)

on:
  push:
    branches: [ droidspaces-support ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        repository: fpl123456/android_kernel_sony_msm8998
        ref: droidspaces-support
        fetch-depth: 1
        path: kernel

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison flex libssl-dev make git ccache python3 wget xz-utils

    - name: Install Clang/LLVM
      run: |
        sudo apt-get install -y clang llvm lld
        clang --version | head -3

    - name: Setup aarch64 cross compiler
      working-directory: kernel
      run: |
        set -e
        # 用 apt 安装的系统交叉编译器，创建 aarch64-linux-androidkernel- 前缀的符号链接
        sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
        mkdir -p prebuilts/gcc/linux-x86/aarch64/aarch64-linux-androidkernel-4.9/bin
        cd prebuilts/gcc/linux-x86/aarch64/aarch64-linux-androidkernel-4.9/bin
        for tool in gcc g++ ld ar as nm strip objdump objcopy ranlib strings; do
          if [ -f /usr/bin/aarch64-linux-gnu-${tool} ]; then
            ln -sf /usr/bin/aarch64-linux-gnu-${tool} aarch64-linux-androidkernel-${tool}
          fi
        done
        ls -la
        echo "✅ Toolchain symlinks created"

    - name: Build kernel
      working-directory: kernel
      run: |
        set -e
        export ARCH=arm64
        export CC=clang
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CROSS_COMPILE=aarch64-linux-androidkernel-
        export CROSS_COMPILE_ARM32=arm-linux-androideabi-
        export PATH="$(pwd)/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-androidkernel-4.9/bin:$PATH"

        echo "=== Environment check ==="
        which clang
        which aarch64-linux-androidkernel-gcc || echo "WARNING: aarch64-linux-androidkernel-gcc not found"
        aarch64-linux-gnu-gcc --version | head -1

        echo "=== Generating defconfig ==="
        mkdir -p out
        make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-androidkernel- CROSS_COMPILE_ARM32=arm-linux-androideabi- lineage-msm8998-yoshino-lilac_defconfig

        echo "=== Verify Droidspaces config ==="
        grep -E "CONFIG_NAMESPACES|CONFIG_CGROUPS|CONFIG_SECCOMP|CONFIG_OVERLAY_FS|CONFIG_ANDROID_PARANOID_NETWORK" out/.config || echo "NOTE: some configs not found"

        echo "=== Building kernel ==="
        make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-androidkernel- CROSS_COMPILE_ARM32=arm-linux-androideabi- -j$(nproc) 2>&1 | tee out/build.log

        echo "=== Build output files ==="
        ls -la out/arch/arm64/boot/ 2>/dev/null || echo "No boot/ dir"
        find out/ -name "Image*" -o -name "vmlinux" -o -name "System.map" 2>/dev/null

        echo "✅ Kernel build completed!"

    - name: Upload kernel artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: kernel-output
        path: kernel/out/
        retention-days: 30

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: kernel/out/build.log
        retention-days: 7
