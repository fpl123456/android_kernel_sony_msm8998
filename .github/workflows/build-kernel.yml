name: Build Kernel (Droidspaces)

on:
  push:
    branches: [ droidspaces-support ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        ref: droidspaces-support
        fetch-depth: 1

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison flex libssl-dev make git ccache python3 xz-utils wget

    - name: Clone AOSP GCC 4.9 toolchain (GitHub mirror)
      timeout-minutes: 15
      run: |
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git toolchain
        echo "CROSS_COMPILE=$(pwd)/toolchain/bin/aarch64-linux-android-" >> $GITHUB_ENV
        $(pwd)/toolchain/bin/aarch64-linux-android-gcc --version | head -1

    - name: Generate defconfig
      timeout-minutes: 5
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=${{ env.CROSS_COMPILE }}
        make O=out lineage-msm8998-yoshino-lilac_defconfig

    - name: Build kernel
      timeout-minutes: 90
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=${{ env.CROSS_COMPILE }}
        make O=out -j$(nproc) 2>&1 | tee build.log

    - name: Verify build output
      run: |
        ls -lh out/arch/arm64/boot/Image.gz-dtb
        echo "Kernel build SUCCESS"

    - name: Upload kernel artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Image.gz-dtb-droidspaces
        path: out/arch/arm64/boot/Image.gz-dtb
        retention-days: 30

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
        retention-days: 7
