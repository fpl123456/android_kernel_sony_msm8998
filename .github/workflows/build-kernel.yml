name: Build Kernel (Droidspaces Support)

on:
  push:
    branches: [ droidspaces-support ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        ref: droidspaces-support
        fetch-depth: 1

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison flex libssl-dev make git ccache python3 gcc

    - name: Setup toolchain (aarch64-linux-android-4.9)
      run: |
        git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 toolchain
        echo "CROSS_COMPILE=$(pwd)/toolchain/bin/aarch64-linux-android-" >> $GITHUB_ENV
        echo "ARCH=arm64" >> $GITHUB_ENV

    - name: Generate defconfig
      run: |
        make O=out ARCH=arm64 CROSS_COMPILE=${{ env.CROSS_COMPILE }} lineage-msm8998-yoshino-lilac_defconfig

    - name: Build kernel
      run: |
        make O=out ARCH=arm64 CROSS_COMPILE=${{ env.CROSS_COMPILE }} -j$(nproc) 2>&1 | tee build.log

    - name: Upload kernel artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Image.gz-dtb-droidspaces
        path: out/arch/arm64/boot/Image.gz-dtb
        retention-days: 30

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
        retention-days: 7
