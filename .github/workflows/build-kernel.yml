name: Build Kernel (Droidspaces)

on:
  push:
    branches: [ droidspaces-support ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        ref: droidspaces-support
        fetch-depth: 1

    - name: Install deps and build kernel
      timeout-minutes: 110
      shell: bash
      run: |
        set -eo pipefail
        echo "=== Installing dependencies ==="
        sudo apt-get update -q
        sudo apt-get install -y bc bison flex libssl-dev make git ccache python3 xz-utils wget gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

        echo "=== Setting up toolchain (aarch64-linux-gnu -> aarch64-linux-android prefix) ==="
        mkdir -p ~/toolchain-bin
        for tool in gcc g++ as ld ar ranlib strip objcopy objdump nm; do
          if [ -f /usr/bin/aarch64-linux-gnu-${tool} ]; then
            ln -sf /usr/bin/aarch64-linux-gnu-${tool} ~/toolchain-bin/aarch64-linux-android-${tool}
          fi
        done
        # Also link cpp
        ln -sf /usr/bin/aarch64-linux-gnu-cpp ~/toolchain-bin/aarch64-linux-android-cpp 2>/dev/null || true
        # Also link gcc-ar, gcc-ranlib etc
        for tool in gcc-ar gcc-ranlib; do
          if [ -f /usr/bin/aarch64-linux-gnu-${tool} ]; then
            ln -sf /usr/bin/aarch64-linux-gnu-${tool} ~/toolchain-bin/aarch64-linux-android-${tool}
          fi
        done
        export PATH=~/toolchain-bin:$PATH
        export CROSS_COMPILE=aarch64-linux-android-
        export ARCH=arm64

        echo "=== Verify toolchain ==="
        aarch64-linux-android-gcc --version | head -1

        echo "=== Generate defconfig ==="
        make O=out ARCH=arm64 CROSS_COMPILE=${CROSS_COMPILE} lineage-msm8998-yoshino-lilac_defconfig

        echo "=== Build kernel ==="
        make O=out ARCH=arm64 CROSS_COMPILE=${CROSS_COMPILE} -j$(nproc) 2>&1 | tee build.log

        echo "=== Verify output ==="
        ls -lh out/arch/arm64/boot/Image.gz-dtb
        echo "BUILD_SUCCESS=true" >> $GITHUB_OUTPUT

    - name: Upload kernel artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Image.gz-dtb-droidspaces
        path: out/arch/arm64/boot/Image.gz-dtb
        retention-days: 30
        if-no-files-found: warn

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
        retention-days: 7
