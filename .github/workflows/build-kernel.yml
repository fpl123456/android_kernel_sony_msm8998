name: Build Lilac Kernel (Droidspaces)

on:
  push:
    branches: [ droidspaces-support ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        repository: fpl123456/android_kernel_sony_msm8998
        ref: droidspaces-support
        fetch-depth: 1
        path: kernel

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison flex libssl-dev make git ccache python3 wget xz-utils

    - name: Install Clang/LLVM
      run: |
        sudo apt-get install -y clang llvm lld
        clang --version | head -3
        which clang && echo "clang: $(which clang)"
        which ld.lld && echo "ld.lld: $(which ld.lld)" || echo "ld.lld not found"

    - name: Clone AOSP GCC 4.9 toolchain
      working-directory: kernel
      run: |
        set -x
        echo "=== Trying LineageOS mirror ==="
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-androidkernel-4.9.git \
          prebuilts/gcc/linux-x86/aarch64/aarch64-linux-androidkernel-4.9 2>&1 || true
        echo "=== Clone result ==="
        ls -la prebuilts/gcc/linux-x86/aarch64/ 2>/dev/null || echo "No prebuilts dir yet"
        if [ -d prebuilts/gcc/linux-x86/aarch64/aarch64-linux-androidkernel-4.9/bin ]; then
          echo "=== Toolchain binaries ==="
          ls prebuilts/gcc/linux-x86/aarch64/aarch64-linux-androidkernel-4.9/bin/ | head -20
        fi

    - name: Build kernel (defconfig + make)
      working-directory: kernel
      run: |
        set -x
        mkdir -p out
        echo "=== Environment ==="
        echo "PWD: $(pwd)"
        clang --version | head -2
        # Decide toolchain
        GCC_BIN="prebuilts/gcc/linux-x86/aarch64/aarch64-linux-androidkernel-4.9/bin"
        if [ -d "$GCC_BIN" ] && [ -f "$GCC_BIN/aarch64-linux-androidkernel-gcc" ]; then
          echo "✅ Using AOSP GCC 4.9: $GCC_BIN"
          CROSS="aarch64-linux-androidkernel-"
          export PATH="$PWD/$GCC_BIN:$PATH"
        else
          echo "⚠️ AOSP GCC not found, using system aarch64-linux-gnu-"
          CROSS="aarch64-linux-gnu-"
        fi
        echo "CROSS_COMPILE=$CROSS"
        # Generate defconfig
        echo "=== make defconfig ==="
        make O=out \
          ARCH=arm64 \
          CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=$CROSS \
          CROSS_COMPILE_ARM32=arm-linux-androideabi- \
          lineage-msm8998-yoshino-lilac_defconfig 2>&1
        echo "=== defconfig done, checking .config ==="
        grep -E "CONFIG_NAMESPACES|CONFIG_CGROUPS|CONFIG_SECCOMP|CONFIG_OVERLAY_FS|CONFIG_ANDROID_PARANOID_NETWORK" out/.config 2>/dev/null || echo "NOTE: .config not found or grep failed"
        # Build kernel
        echo "=== Building kernel ==="
        make O=out \
          ARCH=arm64 \
          CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=$CROSS \
          CROSS_COMPILE_ARM32=arm-linux-androideabi- \
          -j$(nproc) 2>&1 | tee out/build.log
        echo "=== Build exit code: ${PIPESTATUS[0]} ==="
      continue-on-error: true

    - name: Check and upload kernel
      working-directory: kernel
      run: |
        set -x
        echo "=== Find output files ==="
        find out/ -type f -name "Image*" -o -name "vmlinux" -o -name "System.map" 2>/dev/null | tee /tmp/found.txt || true
        echo "=== List out/arch/ ==="
        find out/arch/ -type f 2>/dev/null | head -50 || true
        echo "=== Check specific paths ==="
        ls -lh out/arch/arm64/boot/ 2>/dev/null || echo "No out/arch/arm64/boot/"
        ls -lh out/arch/arm64/boot/Image* 2>/dev/null || echo "No Image* in boot/"
        ls -lh out/vmlinux 2>/dev/null || echo "No vmlinux"
        # Decide artifact
        if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
          echo "ARTIFACT=out/arch/arm64/boot/Image.gz-dtb" >> $GITHUB_ENV
          echo "ARTIFACT_NAME=Image.gz-dtb-droidspaces" >> $GITHUB_ENV
          echo "✅ Found Image.gz-dtb!"
        elif [ -f out/arch/arm64/boot/Image.gz ]; then
          echo "ARTIFACT=out/arch/arm64/boot/Image.gz" >> $GITHUB_ENV
          echo "ARTIFACT_NAME=Image.gz-droidspaces" >> $GITHUB_ENV
          echo "✅ Found Image.gz!"
        elif [ -f out/arch/arm64/boot/Image ]; then
          echo "ARTIFACT=out/arch/arm64/boot/Image" >> $GITHUB_ENV
          echo "ARTIFACT_NAME=Image-droidspaces" >> $GITHUB_ENV
          echo "✅ Found Image!"
        elif [ -f out/vmlinux ]; then
          echo "ARTIFACT=out/vmlinux" >> $GITHUB_ENV
          echo "ARTIFACT_NAME=vmlinux-droidspaces" >> $GITHUB_ENV
          echo "⚠️ Only vmlinux found"
        else
          echo "BUILD_FAILED=true" >> $GITHUB_ENV
          echo "❌ No kernel output files found!"
          echo "=== Last 200 lines of build.log ==="
          tail -200 out/build.log 2>/dev/null || echo "No build.log"
          exit 1
        fi
        echo "BUILD_SUCCESS=true" >> $GITHUB_ENV

    - name: Upload kernel artifact
      if: env.BUILD_SUCCESS == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.ARTIFACT_NAME }}
        path: kernel/${{ env.ARTIFACT }}
        retention-days: 30

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: kernel/out/build.log
        retention-days: 7
