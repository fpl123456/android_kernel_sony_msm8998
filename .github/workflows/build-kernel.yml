name: Build Lilac Kernel (Droidspaces)

on:
  push:
    branches: [ droidspaces-support ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        repository: fpl123456/android_kernel_sony_msm8998
        ref: droidspaces-support
        fetch-depth: 1
        path: kernel

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison flex libssl-dev make git ccache python3 wget xz-utils

    - name: Install Clang/LLVM
      run: |
        sudo apt-get install -y clang llvm lld
        clang --version | head -3
        which clang && echo "clang: $(which clang)"
        which ld.lld && echo "ld.lld: $(which ld.lld)" || echo "ld.lld not found"

    - name: Clone AOSP GCC 4.9 toolchain
      working-directory: kernel
      run: |
        set -x
        echo "=== Trying LineageOS mirror ==="
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-androidkernel-4.9.git \
          prebuilts/gcc/linux-x86/aarch64/aarch64-linux-androidkernel-4.9 2>&1 || true
        echo "=== Clone result ==="
        ls -la prebuilts/gcc/linux-x86/aarch64/ 2>/dev/null || echo "No prebuilts dir yet"
        if [ -d prebuilts/gcc/linux-x86/aarch64/aarch64-linux-androidkernel-4.9/bin ]; then
          echo "=== Toolchain binaries ==="
          ls prebuilts/gcc/linux-x86/aarch64/aarch64-linux-androidkernel-4.9/bin/ | head -20
        fi

    - name: Generate defconfig
      working-directory: kernel
      run: |
        set -x
        mkdir -p out
        echo "=== Environment ==="
        echo "PWD: $(pwd)"
        echo "clang: $(which clang)"
        ls out/ 2>/dev/null || echo "out/ is empty"
        echo "=== Toolchain check ==="
        GCC_DIR="prebuilts/gcc/linux-x86/aarch64/aarch64-linux-androidkernel-4.9/bin"
        if [ -d "$GCC_DIR" ] && [ -f "$GCC_DIR/aarch64-linux-androidkernel-gcc" ]; then
          echo "✅ AOSP GCC toolchain found"
          CROSS="aarch64-linux-androidkernel-"
          GCC_OK=1
        else
          echo "⚠️ AOSP GCC not found, using system aarch64-linux-gnu-"
          CROSS="aarch64-linux-gnu-"
          GCC_OK=0
        fi
        echo "CROSS_COMPILE=$CROSS"
        echo "=== Running make defconfig ==="
        make O=out \
          ARCH=arm64 \
          CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=$CROSS \
          CROSS_COMPILE_ARM32=arm-linux-androideabi- \
          lineage-msm8998-yoshino-lilac_defconfig 2>&1
        echo "=== defconfig result: $? ==="
        echo "=== .config check ==="
        grep -E "CONFIG_NAMESPACES|CONFIG_CGROUPS|CONFIG_SECCOMP|CONFIG_OVERLAY_FS|CONFIG_ANDROID_PARANOID_NETWORK" out/.config 2>/dev/null || echo "No .config found!"
      continue-on-error: true

    - name: Build kernel
      working-directory: kernel
      run: |
        set -x
        mkdir -p out
        GCC_DIR="prebuilts/gcc/linux-x86/aarch64/aarch64-linux-androidkernel-4.9/bin"
        if [ -d "$GCC_DIR" ] && [ -f "$GCC_DIR/aarch64-linux-androidkernel-gcc" ]; then
          CROSS="aarch64-linux-androidkernel-"
        else
          CROSS="aarch64-linux-gnu-"
        fi
        echo "=== Toolchain: CROSS_COMPILE=$CROSS ==="
        echo "=== Building with clang ==="
        make O=out \
          ARCH=arm64 \
          CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=$CROSS \
          CROSS_COMPILE_ARM32=arm-linux-androideabi- \
          -j$(nproc) 2>&1 | tail -150
        echo "=== Build exit code: ${PIPESTATUS[0]} ==="
      continue-on-error: true

    - name: Check build result
      working-directory: kernel
      run: |
        set -x
        echo "=== List out/ ==="
        ls -R out/ 2>/dev/null | head -100 || echo "out/ is empty or missing"
        echo "=== boot/ files ==="
        ls -la out/arch/arm64/boot/ 2>/dev/null || echo "No boot/ dir"
        echo "=== vmlinux ==="
        ls -lh out/vmlinux 2>/dev/null || echo "No vmlinux"
        # Check for actual output files
        FOUND=""
        for f in \
          out/arch/arm64/boot/Image.gz-dtb \
          out/arch/arm64/boot/Image.gz \
          out/arch/arm64/boot/Image \
          out/vmlinux \
          out/System.map; do
          if [ -f "$f" ]; then
            echo "✅ Found: $f"
            FOUND="$FOUND $f"
          fi
        done
        if [ -n "$FOUND" ]; then
          echo "BUILD_SUCCESS=true" >> $GITHUB_ENV
          # Pick the best artifact
          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            echo "ARTIFACT_PATH=out/arch/arm64/boot/Image.gz-dtb" >> $GITHUB_ENV
            echo "ARTIFACT_NAME=Image.gz-dtb-droidspaces" >> $GITHUB_ENV
          elif [ -f out/arch/arm64/boot/Image.gz ]; then
            echo "ARTIFACT_PATH=out/arch/arm64/boot/Image.gz" >> $GITHUB_ENV
            echo "ARTIFACT_NAME=Image.gz-droidspaces" >> $GITHUB_ENV
          elif [ -f out/arch/arm64/boot/Image ]; then
            echo "ARTIFACT_PATH=out/arch/arm64/boot/Image" >> $GITHUB_ENV
            echo "ARTIFACT_NAME=Image-droidspaces" >> $GITHUB_ENV
          fi
          echo "✅ Kernel build succeeded! Found:$FOUND"
        else
          echo "BUILD_SUCCESS=false" >> $GITHUB_ENV
          echo "❌ Kernel build failed - no output files!"
          echo "=== Last 100 lines of build output ==="
          tail -100 out/build.log 2>/dev/null || echo "No build.log"
          grep -i "error\|fatal\|undefined" out/build.log 2>/dev/null | head -30 || true
          exit 1
        fi

    - name: Upload kernel artifact
      if: env.BUILD_SUCCESS == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.ARTIFACT_NAME }}
        path: kernel/${{ env.ARTIFACT_PATH }}
        retention-days: 30

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log-run9
        path: kernel/out/build.log
        retention-days: 7
