name: Build Lilac Kernel (Droidspaces)

on:
  push:
    branches: [ droidspaces-support ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        repository: fpl123456/android_kernel_sony_msm8998
        ref: droidspaces-support
        fetch-depth: 1
        path: kernel

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison flex libssl-dev make git ccache python3 wget xz-utils zip

    - name: Install Clang/LLVM
      run: |
        sudo apt-get install -y clang llvm lld
        clang --version | head -3

    - name: Setup aarch64 cross compiler
      working-directory: kernel
      run: |
        set -e
        sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
        mkdir -p prebuilts/gcc/linux-x86/aarch64/aarch64-linux-androidkernel-4.9/bin
        cd prebuilts/gcc/linux-x86/aarch64/aarch64-linux-androidkernel-4.9/bin
        for tool in gcc g++ ld ar as nm strip objdump objcopy ranlib strings; do
          if [ -f /usr/bin/aarch64-linux-gnu-${tool} ]; then
            ln -sf /usr/bin/aarch64-linux-gnu-${tool} aarch64-linux-androidkernel-${tool}
          fi
        done
        echo "Toolchain symlinks created"

    - name: Build kernel
      working-directory: kernel
      run: |
        set -e
        export ARCH=arm64
        export CC=clang
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CROSS_COMPILE=aarch64-linux-androidkernel-
        export CROSS_COMPILE_ARM32=arm-linux-androideabi-
        export PATH="$(pwd)/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-androidkernel-4.9/bin:$PATH"

        echo "=== Generating defconfig ==="
        mkdir -p out
        make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-androidkernel- CROSS_COMPILE_ARM32=arm-linux-androideabi- lineage-msm8998-yoshino-lilac_defconfig

        echo "=== Verify Droidspaces config ==="
        grep -E "CONFIG_NAMESPACES|CONFIG_CGROUPS|CONFIG_SECCOMP|CONFIG_OVERLAY_FS|CONFIG_ANDROID_PARANOID_NETWORK" out/.config || echo "NOTE: some configs not found"

        echo "=== Building kernel ==="
        make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-androidkernel- CROSS_COMPILE_ARM32=arm-linux-androideabi- -j$(nproc)

        echo "=== Build output files ==="
        ls -lh out/arch/arm64/boot/ 2>/dev/null || echo "No boot/ dir"

    - name: Package flashable ZIP
      working-directory: kernel
      run: |
        set -e
        KERNEL_IMG=""
        for img in out/arch/arm64/boot/Image.gz-dtb out/arch/arm64/boot/Image.gz out/arch/arm64/boot/Image; do
          if [ -f "$img" ]; then
            KERNEL_IMG="$img"
            break
          fi
        done
        if [ -z "$KERNEL_IMG" ]; then
          echo "No kernel image found!"
          exit 1
        fi
        PKG=/tmp/flashable
        rm -rf $PKG && mkdir -p $PKG
        cp "$KERNEL_IMG" "$PKG/kernel"
        mkdir -p $PKG/META-INF/com/google/android/
        echo 'ui_print "Flashing Droidspaces kernel for lilac...";' > $PKG/META-INF/com/google/android/updater-script
        echo 'package_extract_file("kernel", "/dev/block/byname/boot");' >> $PKG/META-INF/com/google/android/updater-script
        echo 'ui_print "Done!";' >> $PKG/META-INF/com/google/android/updater-script
        printf '#!/sbin/sh\nOUTFD=/proc/self/fd/$2\nZIP="$3"\nui_print() { echo "ui_print $1" > "$OUTFD"; echo "ui_print" > "$OUTFD"; }\nui_print "========================================="\nui_print " Lilac Kernel - Droidspaces Support"\nui_print "========================================="\nui_print "Extracting kernel..."\nmkdir -p /tmp/ktmp\nunzip -o "$ZIP" kernel -d /tmp/ktmp\nui_print "Flashing kernel..."\ncat /tmp/ktmp/kernel > /dev/block/byname/boot\nrm -rf /tmp/ktmp\nui_print "Done!"\n' > $PKG/META-INF/com/google/android/update-binary
        chmod 755 $PKG/META-INF/com/google/android/update-binary
        cd $PKG
        zip -r /tmp/lilac-droidspaces.zip .
        cp /tmp/lilac-droidspaces.zip $GITHUB_WORKSPACE/lilac-droidspaces.zip
        echo "Flashable ZIP created:"
        ls -lh $GITHUB_WORKSPACE/lilac-droidspaces.zip

    - name: Upload flashable ZIP
      uses: actions/upload-artifact@v4
      with:
        name: lilac-droidspaces-flashable
        path: lilac-droidspaces.zip
        retention-days: 90

    - name: Upload boot files
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: kernel-boot-files
        path: kernel/out/arch/arm64/boot/
        retention-days: 7

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: kernel/out/build.log
        retention-days: 7
