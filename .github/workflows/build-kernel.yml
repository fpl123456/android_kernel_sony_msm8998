name: Build Kernel (Droidspaces)

on:
  push:
    branches: [ droidspaces-support ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        ref: droidspaces-support
        fetch-depth: 1

    - name: Install dependencies and toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison flex libssl-dev make git ccache python3 gcc
        sudo apt-get install -y gcc-aarch64-linux-gnu

    - name: Build kernel
      env:
        ARCH: arm64
        CROSS_COMPILE: aarch64-linux-gnu-
      run: |
        make O=out lineage-msm8998-yoshino-lilac_defconfig
        make O=out -j$(nproc) 2>&1 | tee build.log
        ls -lh out/arch/arm64/boot/Image.gz-dtb

    - name: Upload kernel artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Image.gz-dtb-droidspaces
        path: out/arch/arm64/boot/Image.gz-dtb
        retention-days: 30

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
        retention-days: 7
